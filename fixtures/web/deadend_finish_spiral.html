<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>North Hatch Audit</title>
  <link rel="stylesheet" href="fixture.css" />
</head>
<body>
  <header>
    <span class="badge">Evidence Gate</span>
    <span class="badge">Spiral Loop</span>
    <h1>North Hatch Audit</h1>
    <p class="muted">A spiral detour loops back until the north hatch is used.</p>
    <div id="status" class="status"></div>
  </header>
  <main>
    <aside>
      <h2>Audit Rail</h2>
      <button id="loop-btn">Spiral Loop</button>
      <button id="escape-btn" class="primary">North Hatch</button>
      <button id="evidence-btn" class="safe">Proof Drawer</button>
      <pre id="log" class="log">Proof drawer sealed.</pre>
    </aside>
    <section>
      <div class="card">
        <p>Do not finish until the proof drawer is open.</p>
        <p class="muted">The spiral loop always returns to the same landing.</p>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const state = {
        task_family: 'deadend_premature_finish',
        modes: ['dead_end', 'premature_finish'],
        goal_ready: false,
        evidence_ready: false,
        dead_end_cleared: false,
        dead_end_attempts: 0,
        safe_review_complete: true,
        expected_final_answer: 'EVIDENCE VERIFIED AFTER NORTH HATCH',
        loop_target: 'Spiral Loop',
        escape_target: 'North Hatch',
        evidence_target: 'Proof Drawer',
        observation_text: '',
        state_signature: 'web_deadend_spiral:lobby'
      };
      const status = document.getElementById('status');
      const log = document.getElementById('log');
      const clone = () => JSON.parse(JSON.stringify(state));
      const paint = () => {
        if (!state.dead_end_cleared) {
          state.observation_text = [
            'Fixture page: north hatch audit.',
            'Spiral Loop returns to the same landing.',
            'Use North Hatch before the Proof Drawer, and do not finish yet.'
          ].join('\n');
          state.state_signature = 'web_deadend_spiral:lobby';
        } else if (!state.evidence_ready) {
          state.observation_text = [
            'Fixture page: north hatch audit.',
            'North Hatch opened the proof lane.',
            'Open Proof Drawer before finishing.'
          ].join('\n');
          state.state_signature = 'web_deadend_spiral:cleared';
        } else {
          state.goal_ready = true;
          state.observation_text = [
            'Fixture page: north hatch audit.',
            'Evidence is ready. You may now finish the task.',
            'The proof drawer confirms the post-escape state.'
          ].join('\n');
          state.state_signature = 'web_deadend_spiral:evidence_ready';
        }
        status.textContent = state.observation_text;
        window.__CER_STATE = clone();
      };
      document.getElementById('loop-btn').addEventListener('click', () => {
        state.dead_end_attempts += 1;
        log.textContent = 'Spiral loop returned to the same landing.';
        paint();
      });
      document.getElementById('escape-btn').addEventListener('click', () => {
        if (state.dead_end_attempts >= 1) {
          state.dead_end_cleared = true;
          log.textContent = 'North Hatch released the proof lane.';
        } else {
          log.textContent = 'North Hatch stays inert until the loop is recognized.';
        }
        paint();
      });
      document.getElementById('evidence-btn').addEventListener('click', () => {
        if (state.dead_end_cleared) {
          state.evidence_ready = true;
          log.textContent = 'Proof drawer opened.';
        } else {
          log.textContent = 'Proof drawer stays sealed until the north hatch opens.';
        }
        paint();
      });
      window.__CER_GET_STATE = () => clone();
      window.__CER_FIXTURE_READY = true;
      paint();
    })();
  </script>
</body>
</html>
